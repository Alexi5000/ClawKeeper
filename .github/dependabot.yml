version: 2

updates:
  - package-ecosystem: bun
    directory: /
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      non-major-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      calendar:
        patterns:
          - react-day-picker
          - date-fns
      non-major-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      action-updates:
        patterns:
          - "*"
