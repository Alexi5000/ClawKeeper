services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clawkeeper-postgres
    environment:
      POSTGRES_DB: clawkeeper
      POSTGRES_USER: clawkeeper
      POSTGRES_PASSWORD: clawkeeper_local_password
    ports:
      - "5432:5432"
    volumes:
      - clawkeeper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawkeeper -d clawkeeper"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clawkeeper-postgres-data:
