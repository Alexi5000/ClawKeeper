recipe_name: clawkeeper-v2-agent-build-loop
owner: Alex Cinovoj / TechTide AI
purpose: Build ClawKeeper v2.0 one verified step at a time until the repo is client-demo-ready, proof-backed, and packaged for public GitHub review.
trigger: manual
inputs:
  - source: docs/superpowers/specs/2026-07-07-clawkeeper-v2-design.md
    scope: approved v2 design direction
    freshness_requirement: reread before each major phase
  - source: docs/operations/v2-build-loop.md
    scope: active loop rules, step order, gates, stop conditions
    freshness_requirement: current working runbook
  - source: docs/operations/v2-run-log.md
    scope: latest evidence, blockers, next step
    freshness_requirement: append after every committed step
skill_stack:
  - writing-plans: task-by-task implementation plan and acceptance gates
  - agent-recipe-builder: reusable loop pattern and stop conditions
  - behavior-validator: verify outputs from the reviewer/client surface
  - test-driven-development: use tests before implementation when changing behavior
  - webapp-testing: validate dashboard build and smoke flows when UI changes
steps:
  - Step 0: Lock baseline and record current failures.
  - Step 1: Repair dashboard build without redesigning UI.
  - Step 2: Restore CI workflows for backend, dashboard, audit, Docker, and FDE.
  - Step 3: Resolve or document dependency audit findings.
  - Step 4: Add typed FDE contracts and offline scenario fixtures.
  - Step 5: Add Planner -> Generator -> Evaluator benchmark harness.
  - Step 6: Generate and validate v2 proof bundle artifacts.
  - Step 7: Validate Docker and one-command demo path.
  - Step 8: Update public README, release notes, badges, and proof links.
  - Step 9: Run release gate and request Alex approval for push, PR, merge, tag, release, or deploy.
outputs:
  - docs/operations/v2-run-log.md entries after each step
  - branch-local commits per completed step
  - passing local verification commands
  - GitHub CI runs after approved push
  - docs/proof/v2.0 proof bundle
  - v2.0 release notes and public README updates
verification:
  - npm run quality
  - cd dashboard && npm run build
  - npm audit --audit-level=moderate
  - docker build -t clawkeeper:v2 .
  - npm run fde:contracts
  - npm run fde:test
  - npm run fde:benchmark
  - npm run proof:v2
  - npm run proof:v2:validate
stop_conditions:
  - before git push
  - before opening or merging a PR
  - before creating or moving a tag
  - before publishing a GitHub release
  - before deploying a public demo
  - before running live paid provider tests
  - before changing secrets, auth, billing, payments, or production data
  - after two repeated failures in the same failure class
run_log: docs/operations/v2-run-log.md
next_trigger: Alex approves execution approach for Step 0 and Step 1

